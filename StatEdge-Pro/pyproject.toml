[project]
name = "statedge-pro"
version = "1.0.0"
description = "AI-powered sports analytics platform for teams and professional bettors"
authors = [{name = "Juan Gonzales", email = "sahjonycapitalllc@outlook.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://statedge-pro.com"

[project.dependencies]
fastapi = "^0.110.0"
uvicorn = "^0.29.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
scikit-learn = "^1.4.0"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
sqlalchemy = "^2.0.23"
psycopg2-binary = "^2.9.9"
redis = "^5.0.1"
langchain = "^0.2.0"
langchain-openai = "^0.1.0"
chromadb = "^0.5.0"

[tool.poetry]
name = "statedge-pro"
version = "1.0.0"
description = ""
authors = ["Juan Gonzales <sahjonycapitalllc@outlook.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = "^0.29.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
scikit-learn = "^1.4.0"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
sqlalchemy = "^2.0.23"
psycopg2-binary = "^2.9.9"
redis = "^5.0.1"
langchain = "^0.2.0"
langchain-openai = "^0.1.0"
chromadb = "^0.5.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uvicorn]
app = "src.api.main:app"
host = "0.0.0.0"
port = 8000
reload = true

[tool.ruff]
select = ["E", "W", "F", "I", "C4", "N", "B", "TCH"]
ignore = ["E501"]
line-length = 88

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"src/api/main.py" = ["F401"]

[tool.ruff.pyproject]
src = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]
include = "*.pyi?$"

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["statedge_pro"]

[tool.mypy]
python_version = "3.10"
show_error_codes = true
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -v"